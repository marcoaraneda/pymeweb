services:
  - type: web
    name: pymeweb-api
    env: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1,pymeweb.onrender.com,pymeweb-api.onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://pymeweb.onrender.com,http://localhost:3000,http://127.0.0.1:3000"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://pymeweb.onrender.com,https://pymeweb-api.onrender.com"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: WEBPAY_COMMERCE_CODE
        value: "597055555532"
      - key: WEBPAY_API_KEY
        value: "579B1A0F0F3F8C2D1B0F3F8C2D1B0F3F"
      - key: WEBPAY_ENVIRONMENT
        value: "INTEGRATION"
