services:
  - type: web
    name: pymeweb-backend
    env: python
    plan: standard
    buildCommand: pip install -r requirements.txt && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DB_NAME
        value: pymeweb
      - key: DB_USER
        fromDatabase:
          name: pymeweb-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: pymeweb-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: pymeweb-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: pymeweb-db
          property: port
      - key: DB_SSLMODE
        value: require
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"

databases:
  - name: pymeweb-db
    databaseName: pymeweb
    user: neondb_owner
    plan: standard
